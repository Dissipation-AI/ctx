name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  ZIG_VERSION: 0.16.0

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig (for libghostty-vt)
        run: |
          curl -sSL "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz" | tar xJ -C "$RUNNER_TEMP"
          echo "ZIG=$RUNNER_TEMP/zig-aarch64-macos-${ZIG_VERSION}/zig" >> "$GITHUB_ENV"

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit and integration tests
        run: cargo test --all-targets

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Dependencies (advisories, licences, bans, sources)
        run: cargo deny check

      - name: Budgets (binary size, memory, latency)
        run: scripts/budgets.sh
