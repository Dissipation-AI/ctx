[workspace]
resolver = "3"
members = [
    "ctx-protocol",
    "ctx-cli",
    "ctx-store",
    "ctx-server",
    "ctx-ask",
    "ctx-mcp",
    "ctx",
    "ctx-launch",
    "ctx-helper",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/Dissipation-AI/ctx"
publish = false

[workspace.dependencies]
# Every dependency is justified in SPEC.md § Stack.
ghostty-vt = "=0.7.0"
libc = "0.2"
lz4_flex = { version = "0.14.0", default-features = false, features = ["safe-encode", "safe-decode", "frame"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
redact = { git = "https://github.com/Dissipation-AI/redact", tag = "v0.1.0" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
toml = "1.1.8"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
zstd = { version = "0.14.2", default-features = false }
proptest = "1.12.0"
insta = { version = "1.49.0", features = ["json"] }

ctx-protocol = { path = "ctx-protocol" }
ctx-cli = { path = "ctx-cli" }
ctx-store = { path = "ctx-store" }
ctx-server = { path = "ctx-server" }
ctx-ask = { path = "ctx-ask" }
ctx-mcp = { path = "ctx-mcp" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
